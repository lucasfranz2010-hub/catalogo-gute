<script>
    // Storage and Cookie Utility Functions
    function setCookie(name, value, days = 365) {
      try {
        const d = new Date();
        d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
        const expires = "expires=" + d.toUTCString();
        document.cookie = `${name}=${encodeURIComponent(value)};${expires};path=/;SameSite=Lax`;
      } catch (e) {
        // Fallback or ignore if blocked
      }
      try {
        localStorage.setItem(name, value);
      } catch (e) {
        // LocalStorage fallback handled
      }
    }

    function getCookie(name) {
      let value = null;
      try {
        const cname = name + "=";
        const decodedCookie = decodeURIComponent(document.cookie);
        const ca = decodedCookie.split(';');
        for (let i = 0; i < ca.length; i++) {
          let c = ca[i];
          while (c.charAt(0) === ' ') {
            c = c.substring(1);
          }
          if (c.indexOf(cname) === 0) {
            value = c.substring(cname.length, c.length);
            break;
          }
        }
      } catch (e) {
        value = null;
      }
      if (value === null || value === undefined || value === '') {
        try {
          value = localStorage.getItem(name);
        } catch (e) {
          value = null;
        }
      }
      return value;
    }

        { id: 'convexo', name: 'Convexo', description: '21 peças' },
        { id: 'aurea', name: 'Áurea', description: '5 peças' },

        { id: 'celebra', name: 'Celebra', emptyNote: 'Em breve' }
      ];

      // Restore collection state from cookie/storage (supporting both legacy and updated keys)
      const savedCollection = getCookie('gute_active_category') || getCookie('gute_selected_collection');
      let selectedCollectionId = (savedCollection && COLLECTIONS.some(c => c.id === savedCollection)) 
        ? savedCollection 
        : 'geral';

      // Item statuses: null | 'my-pieces' | 'wishes'
      const itemStatusMap = {};
      JEWELRY_ITEMS.forEach(it => { itemStatusMap[it.id] = null; });

      // Restore item statuses from cookie/storage
      const savedStatusJson = getCookie('gute_collection_state') || getCookie('gute_item_status_map');
      if (savedStatusJson) {
        try {
          const parsed = JSON.parse(savedStatusJson);
          if (parsed && typeof parsed === 'object') {
            Object.keys(parsed).forEach(id => {
              if (itemStatusMap.hasOwnProperty(id)) {
                itemStatusMap[id] = parsed[id];
              }
            });
          }
        } catch (e) {
          // ignore corrupted data
        }
      }

      function persistStatus() {
        const val = JSON.stringify(itemStatusMap);
        setCookie('gute_collection_state', val, 365);
        setCookie('gute_item_status_map', val, 365);
      }

      // Elements
      const catalogContainer = document.getElementById('catalog-container');
      const emptyCatalog = document.getElementById('empty-catalog');
      const emptyCatalogTitle = document.getElementById('empty-catalog-title');
      const myPiecesContainer = document.getElementById('my-pieces-container');
      const wishesContainer = document.getElementById('wishes-container');
      const emptyMyPieces = document.getElementById('empty-my-pieces');
      const emptyWishes = document.getElementById('empty-wishes');

      const modal = document.getElementById('options-modal');
      const modalBackdrop = document.getElementById('modal-backdrop');
      const modalSheet = document.getElementById('modal-sheet');
      const btnSelectMyPieces = document.getElementById('btn-select-my-pieces');
      const btnSelectWishes = document.getElementById('btn-select-wishes');
      const btnRemoveSelection = document.getElementById('btn-remove-selection');
      const badgeMyPieces = document.getElementById('badge-my-pieces');
      const badgeWishes = document.getElementById('badge-wishes');

      // Drawer Elements
      const drawerMenu = document.getElementById('drawer-menu');
      const drawerBackdrop = document.getElementById('drawer-backdrop');
      const drawerPanel = document.getElementById('drawer-panel');
      const btnOpenMenu = document.getElementById('btn-open-menu');
      const btnCloseMenu = document.getElementById('btn-close-menu');
      const collectionsListEl = document.getElementById('collections-list');
      const drawerCurrentTitle = document.getElementById('drawer-current-title');

      const initialColObj = COLLECTIONS.find(c => c.id === selectedCollectionId);
      if (drawerCurrentTitle && initialColObj) {
        drawerCurrentTitle.textContent = initialColObj.name;
      }

      let currentSelectedItemId = null;

      // Drawer Control Functions
      function openDrawer() {
        drawerMenu.classList.remove('opacity-0', 'pointer-events-none');
        drawerMenu.classList.add('opacity-100');
        requestAnimationFrame(() => {
          drawerPanel.classList.remove('-translate-x-full');
        });
      }

      function closeDrawer() {
        drawerPanel.classList.add('-translate-x-full');
        drawerMenu.classList.remove('opacity-100');
        drawerMenu.classList.add('opacity-0', 'pointer-events-none');
      }

      btnOpenMenu.addEventListener('click', openDrawer);
      btnCloseMenu.addEventListener('click', closeDrawer);
      drawerBackdrop.addEventListener('click', closeDrawer);

      // Render Drawer Collection Items
      function renderCollectionsDrawer() {
        collectionsListEl.innerHTML = '';
        COLLECTIONS.forEach(col => {
          const isSelected = col.id === selectedCollectionId;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `w-full text-left px-5 py-3.5 flex items-center justify-between transition-all border-l-4 ${
            isSelected 
              ? 'border-primary bg-primary/5 text-primary font-semibold pl-4' 
              : 'border-transparent text-on-surface hover:bg-surface-container/50 font-normal'
          }`;
          
          btn.innerHTML = `
            <div class="flex items-center gap-3">
              <span class="font-headline-sm text-base tracking-tight ${isSelected ? 'font-medium' : ''}">${col.name}</span>
            </div>
            <div class="flex items-center gap-2">
              ${col.description ? `<span class="text-[11px] text-on-surface-variant/50">${col.description}</span>` : ''}
              ${col.emptyNote ? `<span class="text-[10px] uppercase tracking-wider text-on-surface-variant/40 font-medium">${col.emptyNote}</span>` : ''}
              ${isSelected ? `<span class="material-symbols-outlined text-[18px] text-primary">chevron_right</span>` : ''}
            </div>
          `;

          btn.addEventListener('click', () => {
            selectedCollectionId = col.id;
            setCookie('gute_active_category', col.id, 365);
            setCookie('gute_selected_collection', col.id, 365);
            drawerCurrentTitle.textContent = col.name;
            renderCollectionsDrawer();
            renderAll();
            closeDrawer();
            
            // Switch to Catálogo tab automatically if not active
            const catTab = document.querySelector('.nav-tab[data-target="tab-catalogo"]');
            if (catTab && !catTab.classList.contains('active')) {
              catTab.click();
            }
          });

          collectionsListEl.appendChild(btn);
        });
      }

      // Card Creation
      function createCard(item, showBuyButton = false) {
        const status = itemStatusMap[item.id];
        const card = document.createElement('div');
        card.dataset.id = item.id;
        
        if (showBuyButton) {
          card.className = 'earring-card cursor-pointer w-full bg-surface-container-lowest rounded-xl p-3 flex flex-col items-center justify-between shadow-sm border border-transparent gap-2.5';
        } else {
          card.className = 'earring-card cursor-pointer w-full aspect-square bg-surface-container-lowest rounded-xl p-2.5 flex items-center justify-center shadow-sm border border-transparent';
        }
        
        if (status === 'my-pieces') {
          card.classList.add('status-my-pieces');
        } else if (status === 'wishes') {
          card.classList.add('status-wishes');
        }

        const imgWrapper = document.createElement('div');
        imgWrapper.className = showBuyButton ? 'w-full aspect-square flex items-center justify-center' : 'w-full h-full flex items-center justify-center';

        const img = document.createElement('img');
        img.src = item.src;
        img.alt = item.name || '';
        img.className = 'w-full h-full object-contain pointer-events-none select-none';
        imgWrapper.appendChild(img);
        card.appendChild(imgWrapper);

        // Buy button rendered exclusively for "Meus Desejos" if link exists
        if (showBuyButton) {
          if (item.link) {
            const buyBtn = document.createElement('a');
            buyBtn.href = item.link;
            buyBtn.target = '_blank';
            buyBtn.rel = 'noopener noreferrer';
            buyBtn.className = 'w-full py-2 px-3 rounded-lg border border-primary/20 bg-primary/5 hover:bg-primary hover:text-white text-primary text-[11px] font-semibold tracking-widest uppercase transition-all duration-200 flex items-center justify-center gap-1.5 shadow-sm active:scale-95';
            buyBtn.innerHTML = `
              <span>COMPRAR</span>
              <span class="material-symbols-outlined text-[14px]">arrow_outward</span>
            `;
            // Prevent card click modal trigger when clicking buy button
            buyBtn.addEventListener('click', (e) => {
              e.stopPropagation();
            });
            card.appendChild(buyBtn);
          } else {
            const unavailBadge = document.createElement('div');
            unavailBadge.className = 'w-full py-2 px-3 rounded-lg border border-outline-variant/30 bg-surface-container/60 text-on-surface-variant/60 text-[10px] font-medium tracking-widest uppercase flex items-center justify-center';
            unavailBadge.textContent = 'INDISPONÍVEL';
            card.appendChild(unavailBadge);
          }
        }

        card.addEventListener('click', () => {
          openModal(item.id);
        });

        return card;
      }

      // Sync All Views
      function renderAll() {
        // Catálogo filtered by Collection
        catalogContainer.innerHTML = '';
        let filteredCatalogItems = [];
        if (selectedCollectionId === 'geral') {
          // Geral shows all items (21 Convexo + 5 Áurea)
          filteredCatalogItems = JEWELRY_ITEMS;
        } else {
          filteredCatalogItems = JEWELRY_ITEMS.filter(it => it.collection === selectedCollectionId);
        }

        if (filteredCatalogItems.length === 0) {
          const currentCol = COLLECTIONS.find(c => c.id === selectedCollectionId);
          emptyCatalogTitle.textContent = `Nenhuma peça na coleção ${currentCol ? currentCol.name : ''} ainda.`;
          emptyCatalog.classList.remove('hidden');
          catalogContainer.classList.add('hidden');
        } else {
          emptyCatalog.classList.add('hidden');
          catalogContainer.classList.remove('hidden');
          filteredCatalogItems.forEach(item => {
            catalogContainer.appendChild(createCard(item, false));
          });
        }

        // Minha Coleção (Shows all user-selected pieces, no buy button)
        myPiecesContainer.innerHTML = '';
        const myPiecesList = JEWELRY_ITEMS.filter(it => itemStatusMap[it.id] === 'my-pieces');
        if (myPiecesList.length === 0) {
          emptyMyPieces.classList.remove('hidden');
        } else {
          emptyMyPieces.classList.add('hidden');
          myPiecesList.forEach(item => {
            myPiecesContainer.appendChild(createCard(item, false));
          });
        }

        // Meus Desejos (Shows all user wishes, with refined buy button)
        wishesContainer.innerHTML = '';
        const wishesList = JEWELRY_ITEMS.filter(it => itemStatusMap[it.id] === 'wishes');
        if (wishesList.length === 0) {
          emptyWishes.classList.remove('hidden');
        } else {
          emptyWishes.classList.add('hidden');
          wishesList.forEach(item => {
            wishesContainer.appendChild(createCard(item, true));
          });
        }
      }

      // Modal Controls
      function openModal(itemId) {
        currentSelectedItemId = itemId;
        const currentStatus = itemStatusMap[itemId];

        if (currentStatus === 'my-pieces') {
          badgeMyPieces.classList.remove('hidden');
          badgeWishes.classList.add('hidden');
          btnRemoveSelection.classList.remove('hidden');
        } else if (currentStatus === 'wishes') {
          badgeMyPieces.classList.add('hidden');
          badgeWishes.classList.remove('hidden');
          btnRemoveSelection.classList.remove('hidden');
        } else {
          badgeMyPieces.classList.add('hidden');
          badgeWishes.classList.add('hidden');
          btnRemoveSelection.classList.add('hidden');
        }

        modal.classList.remove('opacity-0', 'pointer-events-none');
        modal.classList.add('opacity-100');
        requestAnimationFrame(() => {
          modalSheet.classList.remove('translate-y-full');
        });
      }

      function closeModal() {
        modalSheet.classList.add('translate-y-full');
        modal.classList.remove('opacity-100');
        modal.classList.add('opacity-0', 'pointer-events-none');
        currentSelectedItemId = null;
      }

      modalBackdrop.addEventListener('click', closeModal);

      btnSelectMyPieces.addEventListener('click', () => {
        if (!currentSelectedItemId) return;
        itemStatusMap[currentSelectedItemId] = 'my-pieces';
        persistStatus();
        renderAll();
        closeModal();
      });

      btnSelectWishes.addEventListener('click', () => {
        if (!currentSelectedItemId) return;
        itemStatusMap[currentSelectedItemId] = 'wishes';
        persistStatus();
        renderAll();
        closeModal();
      });

      btnRemoveSelection.addEventListener('click', () => {
        if (!currentSelectedItemId) return;
        itemStatusMap[currentSelectedItemId] = null;
        persistStatus();
        renderAll();
        closeModal();
      });

      // Bottom Tabs Switcher
      const navTabs = document.querySelectorAll('.nav-tab');
      const tabContents = document.querySelectorAll('.tab-content');

      navTabs.forEach(tab => {
        tab.addEventListener('click', () => {
          const target = tab.getAttribute('data-target');

          navTabs.forEach(t => {
            t.classList.remove('active', 'text-primary');
            t.classList.add('text-on-surface-variant');
          });
          tab.classList.add('active', 'text-primary');
          tab.classList.remove('text-on-surface-variant');

          tabContents.forEach(section => {
            if (section.id === target) {
              section.classList.remove('hidden');
              section.classList.add('block');
            } else {
              section.classList.remove('block');
              section.classList.add('hidden');
            }
          });

          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });

      // Zoom Controls (Columns: 1, 2, 3)
      const zoomConfigs = [
        { cols: 'grid-cols-3', gap: 'gap-2' },
        { cols: 'grid-cols-2', gap: 'gap-3' },
        { cols: 'grid-cols-1', gap: 'gap-4' }
      ];
      
      const savedZoom = parseInt(getCookie('gute_zoom_level') || getCookie('gute_zoom_index'), 10);
      let zoomIndex = (!isNaN(savedZoom) && savedZoom >= 0 && savedZoom <= 2) ? savedZoom : 2; // Default 1 coluna (imagem ampla)

      function applyZoom(index) {
        const containers = [catalogContainer, myPiecesContainer, wishesContainer];
        containers.forEach(container => {
          zoomConfigs.forEach(conf => {
            container.classList.remove(conf.cols, conf.gap);
          });
          container.classList.add(zoomConfigs[index].cols, zoomConfigs[index].gap);
        });
        setCookie('gute_zoom_level', index.toString(), 365);
        setCookie('gute_zoom_index', index.toString(), 365);
      }

      document.getElementById('zoom-in').addEventListener('click', () => {
        if (zoomIndex < zoomConfigs.length - 1) {
          zoomIndex++;
          applyZoom(zoomIndex);
        }
      });

      document.getElementById('zoom-out').addEventListener('click', () => {
        if (zoomIndex > 0) {
          zoomIndex--;
          applyZoom(zoomIndex);
        }
      });

      // Initial execution
      applyZoom(zoomIndex);
      renderCollectionsDrawer();
      renderAll();
    });
  </script>
</body></html>
